<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

<meta name="robots" content="noindex" />
<title>Nymbl Timeclock</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F7;
  --surface:#FFFFFF;
  --surface2:#F0EEFF;
  --border:#E2DAFF;
  --text:#07051E;
  --muted:#7B6FA8;
  --accent:#7748FF;
  --accent-dark:#26045E;
  --accent-light:#EDE8FF;
  --danger:#FF5959;
  --danger-light:rgba(255,89,89,0.1);
  --warn:#F59E0B;
  --warn-light:rgba(245,158,11,0.1);
  --radius:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F7F7F7;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;}
.container{width:100%;max-width:420px;}
.logo-wrap{text-align:center;margin-bottom:2rem;padding-top:0.5rem;}
.logo-wrap img{height:44px;width:auto;}
.logo-wrap .sub{font-size:11px;color:#7B6FA8;margin-top:6px;letter-spacing:0.08em;text-transform:uppercase;font-family:'Inter',sans-serif;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;}
input,select{width:100%;padding:11px 14px;border:1px solid #E2DAFF;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:15px;background:#F8F5FF;color:#07051E;outline:none;transition:border-color 0.15s;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}
select option{background:var(--surface2);}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #E2DAFF;background:#FFFFFF;color:#07051E;transition:all 0.15s;white-space:nowrap;}
.btn:hover{background:#F0EEFF;}
.btn-primary{background:#7748FF;border-color:#7748FF;color:#fff;}
.btn-primary:hover{background:#26045E;border-color:#26045E;}
.btn-danger{background:#FF5959;border-color:#FF5959;color:#fff;}
.btn-danger:hover{opacity:0.88;}
.btn-full{width:100%;padding:14px;font-size:15px;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-ghost{border-color:transparent;background:transparent;color:#7B6FA8;}
.btn-ghost:hover{color:#07051E;background:#F0EEFF;}
.btn-lunch{background:var(--warn);border-color:var(--warn);color:#fff;}
.btn-lunch:hover{background:#D97706;border-color:#D97706;}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;letter-spacing:0.02em;}
.badge-in{background:#EDE8FF;color:#26045E;}
.badge-lunch{background:var(--warn-light);color:var(--warn);}
.badge-out{background:rgba(139,135,176,0.15);color:var(--muted);}
.badge-pto{background:rgba(56,189,248,0.15);color:#38BDF8;}
.badge-sick{background:var(--danger-light);color:#FF8080;}
.badge-holiday{background:rgba(52,211,153,0.15);color:#34D399;}
.agent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.12s;}
.agent-row:last-child{border-bottom:none;}
.agent-row:hover{opacity:0.7;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;font-family:'Sora',sans-serif;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pinkey{height:58px;font-size:22px;font-family:'Sora',sans-serif;font-weight:600;border:1px solid #E2DAFF;border-radius:var(--radius-sm);background:#FFFFFF;color:#07051E;cursor:pointer;transition:background 0.1s,transform 0.08s;}
.pinkey:hover{background:#F0EEFF;}
.pinkey:active{transform:scale(0.94);}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:1.25rem 0;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid #E2DAFF;transition:all 0.15s;}
.pin-dot.filled{background:#7748FF;border-color:#7748FF;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
.stat{background:#F0EEFF;border:1px solid #E2DAFF;border-radius:var(--radius-sm);padding:14px 12px;text-align:center;}
.stat-val{font-size:24px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text);}
.stat-label{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.07em;}
.err{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.ok{color:#34D399;font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.time-display{font-family:'Sora',sans-serif;font-size:42px;font-weight:700;text-align:center;letter-spacing:-1px;margin:0.5rem 0;color:var(--text);}
.punch-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--muted);}
.punch-row:last-child{border-bottom:none;}
.punch-row span:last-child{color:var(--text);font-family:'Sora',sans-serif;font-size:12px;}
.week-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #E2DAFF;font-size:13px;flex-wrap:wrap;}
.week-row:last-child{border-bottom:none;}
.row-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.row-item:last-child{border-bottom:none;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:2rem auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.notice{font-size:13px;color:var(--muted);text-align:center;padding:1rem;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.25rem;flex-wrap:wrap;}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.week-nav span{font-size:13px;font-weight:500;color:var(--text);}
.hero-card{background:#FFFFFF;border:1px solid #E2DAFF;border-radius:var(--radius);padding:1.5rem;margin-bottom:12px;text-align:center;}

.userbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px;}
.userbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge-inactive{background:rgba(139,135,176,0.15);color:var(--muted);}
label.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin:2px 0 -2px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>

<script>
'use strict';
/* Nymbl Timeclock — Microsoft sign-in version.
   Security is enforced by the database (Row Level Security), not by this page. */
const SURL='https://hdjujofjpyzkzzhwaegb.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkanVqb2ZqcHl6a3p6aHdhZWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzI5NTksImV4cCI6MjA5MTg0ODk1OX0.bVvDP_d9dALvlvVnbuACftXlp4UEiYt_peU4hudFNTc';
const sb=window.supabase.createClient(SURL,SKEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=[{bg:'#2D1B69',text:'#C4B5FD'},{bg:'#1E3A5F',text:'#93C5FD'},{bg:'#1A3A2A',text:'#6EE7B7'},{bg:'#3B1F2B',text:'#F9A8D4'},{bg:'#2D2A1A',text:'#FDE68A'},{bg:'#1F2937',text:'#9CA3AF'}];
const clr=id=>COLORS[Math.abs(Number(id)||0)%COLORS.length];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';
const fmtT=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>new Date(ts).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const fmtDur=ms=>{const totalM=Math.round(ms/60000),h=Math.floor(totalM/60),m=totalM%60;return h>0?h+'h '+m+'m':m+'m';};
const toLDT=ts=>{const d=new Date(ts);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const TOLAB={pto:'PTO',sick:'Sick',holiday:'Holiday'};
const TOBADGE={pto:'badge-pto',sick:'badge-sick',holiday:'badge-holiday'};
const PL={shift_in:'Punch In',shift_out:'Punch Out',lunch_out:'Lunch start',lunch_in:'Lunch end'};

function getWeekRange(offset){
  const now=new Date(),day=now.getDay();
  const sun=new Date(now);sun.setDate(now.getDate()-day+offset*7);sun.setHours(0,0,0,0);
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);sat.setHours(23,59,59,999);
  return{start:sun,end:sat};
}
function statusOf(p){if(!p)return'out';if(p.type==='shift_in'||p.type==='lunch_in')return'in';if(p.type==='lunch_out')return'lunch';return'out';}
function statusLabel(s){if(s==='in')return['In','badge-in'];if(s==='lunch')return['On lunch','badge-lunch'];return['Out','badge-out'];}
function actions(s){if(s==='out')return[['shift_in','Punch in','btn-primary']];if(s==='in')return[['lunch_out','🍽 Start lunch','btn-lunch'],['shift_out','Punch out','btn-danger']];if(s==='lunch')return[['lunch_in','🍽 End lunch','btn-lunch'],['shift_out','Punch out','btn-danger']];return[];}
const toMinute=ts=>Math.floor(new Date(ts).getTime()/60000)*60000;
function workedMs(punches){ // punches ascending
  let sMs=0,lMs=0,sS=null,lS=null;
  punches.forEach(p=>{const t=toMinute(p.punched_at);
    if(p.type==='shift_in')sS=t;
    if(p.type==='shift_out'&&sS!==null){sMs+=t-sS;sS=null;}
    if(p.type==='lunch_out')lS=t;
    if(p.type==='lunch_in'&&lS!==null){lMs+=t-lS;lS=null;}
  });
  return Math.max(0,sMs-lMs);
}
function errMsg(e){
  const m=(e&&e.message)?e.message:String(e);
  if(e&&e.code==='23505')return 'That entry already exists (the email or name is already in use).';
  if((e&&e.code==='42501')||/row-level security|permission denied/i.test(m))return "You don't have permission to do that.";
  return m;
}
async function must(p){const r=await p;if(r.error)throw r.error;return r.data;}
async function guard(fn){try{await fn();}catch(e){alert('Error: '+errMsg(e));}}
async function fetchAll(build){let out=[],from=0;const step=1000;for(;;){const rows=await must(build(from,from+step-1));out=out.concat(rows||[]);if(!rows||rows.length<step)break;from+=step;}return out;}
async function getPunches(id,start,end){
  let q=sb.from('punches').select('*').eq('agent_id',id).order('punched_at',{ascending:false}).limit(200);
  if(start)q=q.gte('punched_at',start.toISOString());
  if(end)q=q.lte('punched_at',end.toISOString());
  return (await must(q))||[];
}
const getTO=id=>must(sb.from('time_off').select('*').eq('agent_id',id).order('date',{ascending:false}).limit(50));

/* ---------- state ---------- */
let view='loading',session=null,me={agent:null,roles:[],isAdmin:false,isMgr:false};
let teams=[],agents=[],latest={},managers=[];
let tab='me',teamFilter='all',showInactive=false,loading=false,loginErr='';
let myPunches=[],myWeek=[],myTab='today';
let wPunches=[],wTO=[],wkOffset=0;
let editAgent=null,editPunches=[],editMsg='',editingPunchId=null;
let toAgent=null,toList=[],toMsg='';
let agMsg='',adminMsg='',agEditing=null;

function resetState(){
  me={agent:null,roles:[],isAdmin:false,isMgr:false};
  teams=[];agents=[];latest={};managers=[];myPunches=[];myWeek=[];wPunches=[];wTO=[];
  tab='me';teamFilter='all';wkOffset=0;myTab='today';
}
const teamName=id=>{const t=teams.find(x=>x.id===id);return t?t.name:'';};
const manageable=()=>me.isAdmin?teams:teams.filter(t=>me.roles.some(r=>r.team_id===t.id));
const vis=()=>agents.filter(a=>teamFilter==='all'||a.team_id===teamFilter);

/* ---------- data loading ---------- */
async function loadMgrData(){
  const [ag,lp,tm]=await Promise.all([
    must(sb.from('agents').select('*').order('name')),
    must(sb.rpc('latest_punches')),
    me.isAdmin?must(sb.from('team_members').select('*').order('email')):Promise.resolve([])
  ]);
  agents=ag||[];latest={};(lp||[]).forEach(p=>{latest[p.agent_id]=p;});managers=tm||[];
}
async function loadMine(){
  myPunches=await getPunches(me.agent.id);
  if(myTab==='week'){const{start,end}=getWeekRange(0);myWeek=await getPunches(me.agent.id,start,end);}
}
async function loadWeek(){
  loading=true;render();
  const{start,end}=getWeekRange(wkOffset);
  try{
    wPunches=await fetchAll((f,t)=>sb.from('punches').select('*').gte('punched_at',start.toISOString()).lte('punched_at',end.toISOString()).order('punched_at',{ascending:true}).order('id').range(f,t));
    wTO=await fetchAll((f,t)=>sb.from('time_off').select('*').gte('date',ymd(start)).lte('date',ymd(end)).order('date').order('id').range(f,t));
  }catch(e){wPunches=[];wTO=[];alert('Could not load the report: '+errMsg(e));}

}

/* ---------- boot / auth ---------- */
async function boot(){
  const q=new URLSearchParams(location.search);
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const oauthErr=q.get('error_description')||h.get('error_description');
  if(oauthErr)loginErr=oauthErr;
  try{
    const{data}=await sb.auth.getSession();
    session=data.session;
  }catch(e){loginErr='Sign-in problem: '+errMsg(e);}
  if(q.get('code')||q.get('error')||h.get('error'))history.replaceState({},document.title,location.pathname);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&session){session=null;resetState();view='login';render();}});
  if(session)await enter();else{view='login';render();}
}
async function enter(){
  view='loading';render();
  try{
    await sb.rpc('claim_access'); // links this login to the agent/manager record with the same email
    const uid=session.user.id;
    const[a,tm]=await Promise.all([
      must(sb.from('agents').select('*').eq('user_id',uid)),
      must(sb.from('team_members').select('*').eq('user_id',uid))
    ]);
    me.agent=(a&&a[0])||null;me.roles=tm||[];
    me.isAdmin=me.roles.some(r=>r.role==='admin'&&r.team_id==null);
    me.isMgr=me.roles.length>0;
    teams=(await must(sb.from('teams').select('*').order('name')))||[];
    if(!me.isMgr&&!me.agent){view='noaccess';render();return;}
    if(!me.isMgr&&me.agent&&!me.agent.active){view='inactive';render();return;}
    if(me.isMgr)await loadMgrData();
    const isAgent=!!(me.agent&&me.agent.active);
    if(isAgent)await loadMine();
    tab=isAgent?'me':'team';
    view='main';render();
  }catch(e){loginErr='Could not load your account: '+errMsg(e);view='error';render();}
}

  const a=toAgent,c=clr(a.id);
  const rows=toList.slice(0,30).map(t=>'<div class="row-item"><div style="flex:1"><span class="badge '+(TOBADGE[t.type]||'badge-out')+'" style="margin-right:6px">'+esc(TOLAB[t.type]||t.type)+'</span><span style="font-weight:500">'+esc(t.date)+'</span>'+(t.note?' <span style="color:var(--muted);font-size:12px">· '+esc(t.note)+'</span>':'')+'</div><div style="font-size:13px;font-weight:500;margin-right:8px">'+esc(t.hours)+'h</div><button class="btn btn-sm" style="color:var(--danger);border-color:var(--danger)" data-dto="'+t.id+'">Delete</button></div>').join('')||'<p class="notice">No time off recorded.</p>';
  return '<button class="btn btn-ghost btn-sm" id="b-back">← Back</button><div class="card" style="margin-top:12px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem"><div class="avatar" style="background:'+c.bg+';color:'+c.text+'">'+esc(initials(a.name))+'</div><div style="font-size:16px;font-weight:600;font-family:Sora,sans-serif">'+esc(a.name)+'</div></div><div class="card-title">Add time off</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1rem"><select id="tot"><option value="pto">PTO</option><option value="sick">Sick Day</option><option value="holiday">Company Holiday</option></select><input type="date" id="tod" value="'+todayStr()+'" /><input type="number" id="toh" placeholder="Hours (e.g. 8)" min="1" max="24" value="8" /><input type="text" id="ton" placeholder="Note (optional)" /><button class="btn btn-primary" id="b-ato">Add time off</button></div><div class="ok" id="tom">'+esc(toMsg)+'</div></div><div class="card"><div class="card-title">Time off history</div>'+rows+'</div>';
}

/* ---------- events ---------- */
const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
document.getElementById('app').addEventListener('change',async e=>{
  if(e.target.id==='tf'){teamFilter=e.target.value==='all'?'all':Number(e.target.value);render();}
  if(e.target.id==='show-inact'){showInactive=e.target.checked;render();}
});
document.getElementById('app').addEventListener('click',async e=>{
  const t=e.target;
  const punchB=t.closest('[data-punch]');
  if(punchB){
    loading=true;render();
    try{await must(sb.rpc('punch',{p_type:punchB.dataset.punch}));}catch(err){alert(errMsg(err));}
    try{await loadMine();}catch(err){alert(errMsg(err));}
    loading=false;render();return;
  }
  const tabB=t.closest('[data-tab]');
  if(tabB){
    tab=tabB.dataset.tab;
    if(tab==='week'){await guard(loadWeek);return;}
    if(tab==='team'||tab==='agents'||tab==='admin'){await guard(loadMgrData);}
    if(tab==='me'){await guard(loadMine);}
    render();return;
  }
  const atabB=t.closest('[data-atab]');
  if(atabB){myTab=atabB.dataset.atab;await guard(loadMine);render();return;}
  const deB=t.closest('[data-deact]');
  if(deB){
    const a=agents.find(x=>x.id===Number(deB.dataset.deact));
    const on=statusOf(latest[a.id])!=='out';
    const msg='Deactivate '+a.name+'?\n\nThey will no longer be able to sign in or punch. Their history is kept and still appears in reports.'+(on?'\n\nNOTE: they are currently clocked in. You may want to add a punch-out for them first.':'');
    if(!confirm(msg))return;
    await guard(async()=>{await must(sb.from('agents').update({active:false}).eq('id',a.id));await loadMgrData();});
    render();return;
  }
  const reB=t.closest('[data-react]');
  if(reB){await guard(async()=>{await must(sb.from('agents').update({active:true}).eq('id',Number(reB.dataset.react)));await loadMgrData();});render();return;}
  const edagB=t.closest('[data-edag]');
  if(edagB){agEditing=agents.find(x=>x.id===Number(edagB.dataset.edag));agMsg='';view='edit-agent';render();return;}
  const epB=t.closest('[data-epb]');
  if(epB){
    await guard(async()=>{
      const{start,end}=getWeekRange(wkOffset);
      editAgent=agents.find(a=>a.id===Number(epB.dataset.epb));
      editPunches=await getPunches(editAgent.id,start,end);editMsg='';editingPunchId=null;view='edit-punches';
    });
    render();return;
  }
  const epRow=t.closest('[data-ep]');
  if(epRow){editingPunchId=Number(epRow.dataset.ep);editMsg='';render();return;}
  if(t.closest('[data-cep]')){editingPunchId=null;render();return;}
  const spB=t.closest('[data-sp]');
  if(spB){
    const v=val('ep-dt'),type=val('ep-type');
    if(!v){editMsg='Pick a time.';render();return;}
    try{
      await must(sb.from('punches').update({punched_at:new Date(v).toISOString(),type}).eq('id',Number(spB.dataset.sp)));
      const{start,end}=getWeekRange(wkOffset);editPunches=await getPunches(editAgent.id,start,end);editingPunchId=null;editMsg='Saved!';
    }catch(ex){editMsg='Error: '+errMsg(ex);}
    render();return;
  }
  const dpB=t.closest('[data-dp]');
  if(dpB){
    if(!confirm('Delete this punch?'))return;
    await guard(async()=>{await must(sb.from('punches').delete().eq('id',Number(dpB.dataset.dp)));const{start,end}=getWeekRange(wkOffset);editPunches=await getPunches(editAgent.id,start,end);editingPunchId=null;editMsg='Deleted.';});
    render();return;
  }
  const toB=t.closest('[data-tob]');
  if(toB){
    await guard(async()=>{toAgent=agents.find(a=>a.id===Number(toB.dataset.tob));toList=(await getTO(toAgent.id))||[];toMsg='';view='time-off';});
    render();return;
  }
  const dtoB=t.closest('[data-dto]');
  if(dtoB){
    if(!confirm('Delete this entry?'))return;
    await guard(async()=>{await must(sb.from('time_off').delete().eq('id',Number(dtoB.dataset.dto)));toList=(await getTO(toAgent.id))||[];toMsg='Deleted.';});
    render();return;
  }
  const rmB=t.closest('[data-rmmgr]');
  if(rmB){
    const m=managers.find(x=>x.id===Number(rmB.dataset.rmmgr));
    if(!confirm('Remove '+m.email+' as '+m.role+'?'))return;
    await guard(async()=>{await must(sb.from('team_members').delete().eq('id',m.id));await loadMgrData();adminMsg='';});
    render();return;
  }
  const bid=t.id||(t.closest('button')&&t.closest('button').id);
  if(bid==='b-login'){
    loginErr='';
    const{error}=await sb.auth.signInWithOAuth({provider:'azure',options:{scopes:'email',redirectTo:location.origin+location.pathname}});
    if(error){loginErr=errMsg(error);render();}
  }
  else if(bid==='b-logout'){await sb.auth.signOut();session=null;resetState();loginErr='';view='login';render();}
  else if(bid==='b-retry'){await enter();}
  else if(bid==='b-back'){view='main';tab='agents';render();}
  else if(bid==='b-wp'){wkOffset--;await loadWeek();}
  else if(bid==='b-wn'){if(wkOffset<0){wkOffset++;await loadWeek();}}
  else if(bid==='b-export'){exportCSV();}
  else if(bid==='b-add'){
    const name=val('nn').trim(),email=val('ne').trim().toLowerCase(),tz=val('ntz');
    const mt=manageable();
    const team_id=document.getElementById('nt')?Number(val('nt')):(teamFilter!=='all'&&mt.find(x=>x.id===teamFilter)?teamFilter:(mt[0]&&mt[0].id));
    if(!name){agMsg='Enter a name.';render();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){agMsg='Enter a valid work email.';render();return;}
    if(!team_id){agMsg='No team available to add to.';render();return;}
    try{await must(sb.from('agents').insert({name,email,timezone:tz,team_id}));agMsg='';await loadMgrData();}catch(ex){agMsg=errMsg(ex);}
    render();
  }
  else if(bid==='b-saveag'){
    const name=val('ean').trim(),email=val('eae').trim().toLowerCase(),tz=val('eaz');
    const upd={name,email:email||null,timezone:tz};
    if(document.getElementById('eat'))upd.team_id=Number(val('eat'));
    if(!name){agMsg='Enter a name.';render();return;}
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){agMsg='Enter a valid email.';render();return;}
    try{await must(sb.from('agents').update(upd).eq('id',agEditing.id));await loadMgrData();agMsg='';view='main';tab='agents';}catch(ex){agMsg=errMsg(ex);}
    render();
  }
  else if(bid==='b-ap'){
    const type=val('apt'),v=val('apdt');
    if(!v){editMsg='Pick a time.';render();return;}
    try{
      await must(sb.from('punches').insert({agent_id:editAgent.id,team_id:editAgent.team_id,type,punched_at:new Date(v).toISOString()}));
      const{start,end}=getWeekRange(wkOffset);editPunches=await getPunches(editAgent.id,start,end);editMsg='Added!';
    }catch(ex){editMsg='Error: '+errMsg(ex);}
    render();
  }
  else if(bid==='b-ato'){
    const type=val('tot'),date=val('tod'),hours=val('toh'),note=val('ton').trim();
    if(!date||!hours){toMsg='Fill in date and hours.';render();return;}
    try{await must(sb.from('time_off').insert({agent_id:toAgent.id,team_id:toAgent.team_id,date,type,hours:Number(hours),note:note||null}));toList=(await getTO(toAgent.id))||[];toMsg='Added!';}catch(ex){toMsg='Error: '+errMsg(ex);}
    render();
  }
  else if(bid==='b-addteam'){
    const name=val('ntn').trim();
    if(!name){adminMsg='Enter a team name.';render();return;}
    try{await must(sb.from('teams').insert({name}));teams=(await must(sb.from('teams').select('*').order('name')))||[];adminMsg='';}catch(ex){adminMsg=errMsg(ex);}
    render();
  }
  else if(bid==='b-addmgr'){
    const email=val('nme').trim().toLowerCase(),scope=val('nms');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){adminMsg='Enter a valid work email.';render();return;}
    const row=scope==='all'?{email,role:'admin',team_id:null}:{email,role:'manager',team_id:Number(scope)};
    try{await must(sb.from('team_members').insert(row));await loadMgrData();adminMsg='';}catch(ex){adminMsg=errMsg(ex);}
    render();
  }
});

/* ---------- CSV export for HR (same layout as the original timeclock) ---------- */
function exportCSV(){
  const{start,end}=getWeekRange(wkOffset);
  const wk=start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const weekLabel=wk+' - '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const grouped={};
  vis().forEach(a=>{grouped[a.id]={name:a.name,tz:a.timezone||'',events:[],to:[]};});
  wPunches.forEach(p=>{if(grouped[p.agent_id])grouped[p.agent_id].events.push(p);});
  wTO.forEach(x=>{if(grouped[x.agent_id])grouped[x.agent_id].to.push(x);});
  const msToHrs=ms=>Math.round(ms/36000)/100;
  const fmt2=n=>n>0?n.toFixed(2):'';
  const TZ_IANA={EST:'America/New_York',CST:'America/Chicago',MST:'America/Denver',PST:'America/Los_Angeles',AKST:'America/Anchorage',HST:'Pacific/Honolulu'};
  const agentFmt=(tz,ts,opts)=>new Intl.DateTimeFormat('en-US',{timeZone:TZ_IANA[tz]||'UTC',...opts}).format(new Date(ts));
  const PUNCH_LABEL={shift_in:'Punch In',shift_out:'Punch Out',lunch_out:'Lunch Out',lunch_in:'Lunch In'};
  // quote a cell; neutralise leading = + - @ so spreadsheets never run typed text as a formula
  const q=s=>{s=String(s);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};

  let csv='Nymbl Timeclock Report\n';
  csv+='"Week: '+weekLabel+'"\n';
  csv+='\n';
  csv+='Agent,Timezone,Date,Punch Type,Time,Hours Worked,Time Off Type,Time Off Hours,Note,Grand Total\n';

  Object.values(grouped).forEach(g=>{
    if(!g.events.length&&!g.to.length)return;
    let workedHrsWeek=0,toHrsWeek=0;
    const agentDay=ts=>agentFmt(g.tz,ts,{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/(\d+)\/(\d+)\/(\d+)/,'$3-$1-$2');
    const fmtTime=ts=>agentFmt(g.tz,ts,{hour:'2-digit',minute:'2-digit',hour12:true});
    const byDay={};
    g.events.forEach(p=>{const day=agentDay(p.punched_at);if(!byDay[day])byDay[day]={punches:[],to:[]};byDay[day].punches.push(p);});
    g.to.forEach(x=>{const day=x.date;if(!byDay[day])byDay[day]={punches:[],to:[]};byDay[day].to.push(x);});
    csv+=q(g.name)+',"'+g.tz+'","","","","","","","",""\n';
    Object.entries(byDay).sort().forEach(([day,data])=>{
      const dayLabel=new Date(day+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',year:'2-digit'});
      const sorted=[...data.punches].sort((a,b)=>new Date(a.punched_at)-new Date(b.punched_at));
      // Punch times are only shown to the minute, so hours are computed on whole minutes too.
      let dayMs=0,lastIn=null,lastBreakOut=null,breakMs=0;
      sorted.forEach(p=>{
        const tm=toMinute(p.punched_at);
        if(p.type==='shift_in'){lastIn=tm;}
        else if(p.type==='lunch_out'){lastBreakOut=tm;}
        else if(p.type==='lunch_in'){if(lastBreakOut!==null){breakMs+=tm-lastBreakOut;}lastBreakOut=null;}
        else if(p.type==='shift_out'){if(lastIn!==null){dayMs+=tm-lastIn;}lastIn=null;}
      });
      const dayWorkedHrs=msToHrs(Math.max(0,dayMs-breakMs));
      workedHrsWeek+=dayWorkedHrs;
      const toLabels=data.to.map(x=>TOLAB[x.type]).join(', ');
      const dayToHrs=data.to.reduce((s,x)=>s+Number(x.hours),0);
      toHrsWeek+=dayToHrs;
      const toNotes=data.to.map(x=>x.note).filter(Boolean).join(', ');
      sorted.forEach(p=>{csv+=',"",'+q(dayLabel)+','+q(PUNCH_LABEL[p.type]||p.type)+','+q(fmtTime(p.punched_at))+',"","","","",""\n';});
      if(sorted.length===0&&data.to.length){csv+=',"",'+q(dayLabel)+',"","","",'+q(toLabels)+','+q(dayToHrs>0?dayToHrs.toFixed(2):'')+','+q(toNotes)+',""\n';}
      csv+=',"","Daily Total","","",'+q(fmt2(dayWorkedHrs))+','+q(toLabels)+','+q(dayToHrs>0?dayToHrs.toFixed(2):'')+','+q(toNotes)+',""\n';
    });
    const grandTotal=workedHrsWeek+toHrsWeek;
    csv+=',"","WEEK TOTAL","","",'+q(fmt2(workedHrsWeek))+',"",'+q(toHrsWeek>0?toHrsWeek.toFixed(2):'')+',"",'+q(fmt2(grandTotal))+'\n';
    csv+='\n';
  });

  const tn=teamFilter!=='all'?'_'+teamName(teamFilter).replace(/[^a-z0-9]+/gi,'_'):'';
  const link=document.createElement('a');
  link.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+csv);
  link.download='nymbl_timeclock'+tn+'_'+wk.replace(/\s/g,'_')+'.csv';
  link.click();
}

/* ---------- clock ---------- */
function updateClock(){
  const now=new Date(),t=document.getElementById('lt'),d=document.getElementById('ld');
  if(t)t.textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(d)d.textContent=now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
setInterval(updateClock,1000);
boot();
