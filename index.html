<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Nymbl Timeclock</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F7;
  --surface:#FFFFFF;
  --surface2:#F0EEFF;
  --border:#E2DAFF;
  --text:#07051E;
  --muted:#7B6FA8;
  --accent:#7748FF;
  --accent-dark:#26045E;
  --accent-light:#EDE8FF;
  --danger:#FF5959;
  --danger-light:rgba(255,89,89,0.1);
  --warn:#F59E0B;
  --warn-light:rgba(245,158,11,0.1);
  --radius:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F7F7F7;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;}
.container{width:100%;max-width:420px;}
.logo-wrap{text-align:center;margin-bottom:2rem;padding-top:0.5rem;}
.logo-wrap img{height:44px;width:auto;}
.logo-wrap .sub{font-size:11px;color:#7B6FA8;margin-top:6px;letter-spacing:0.08em;text-transform:uppercase;font-family:'Inter',sans-serif;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;}
input,select{width:100%;padding:11px 14px;border:1px solid #E2DAFF;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:15px;background:#F8F5FF;color:#07051E;outline:none;transition:border-color 0.15s;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}
select option{background:var(--surface2);}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #E2DAFF;background:#FFFFFF;color:#07051E;transition:all 0.15s;white-space:nowrap;}
.btn:hover{background:#F0EEFF;}
.btn-primary{background:#7748FF;border-color:#7748FF;color:#fff;}
.btn-primary:hover{background:#26045E;border-color:#26045E;}
.btn-danger{background:#FF5959;border-color:#FF5959;color:#fff;}
.btn-danger:hover{opacity:0.88;}
.btn-full{width:100%;padding:14px;font-size:15px;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-ghost{border-color:transparent;background:transparent;color:#7B6FA8;}
.btn-ghost:hover{color:#07051E;background:#F0EEFF;}
.btn-lunch{background:var(--warn);border-color:var(--warn);color:#fff;}
.btn-lunch:hover{background:#D97706;border-color:#D97706;}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;letter-spacing:0.02em;}
.badge-in{background:#EDE8FF;color:#26045E;}
.badge-lunch{background:var(--warn-light);color:var(--warn);}
.badge-out{background:rgba(139,135,176,0.15);color:var(--muted);}
.badge-pto{background:rgba(56,189,248,0.15);color:#38BDF8;}
.badge-sick{background:var(--danger-light);color:#FF8080;}
.badge-holiday{background:rgba(52,211,153,0.15);color:#34D399;}
.agent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.12s;}
.agent-row:last-child{border-bottom:none;}
.agent-row:hover{opacity:0.7;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;font-family:'Sora',sans-serif;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pinkey{height:58px;font-size:22px;font-family:'Sora',sans-serif;font-weight:600;border:1px solid #E2DAFF;border-radius:var(--radius-sm);background:#FFFFFF;color:#07051E;cursor:pointer;transition:background 0.1s,transform 0.08s;}
.pinkey:hover{background:#F0EEFF;}
.pinkey:active{transform:scale(0.94);}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:1.25rem 0;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid #E2DAFF;transition:all 0.15s;}
.pin-dot.filled{background:#7748FF;border-color:#7748FF;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
.stat{background:#F0EEFF;border:1px solid #E2DAFF;border-radius:var(--radius-sm);padding:14px 12px;text-align:center;}
.stat-val{font-size:24px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text);}
.stat-label{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.07em;}
.err{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.ok{color:#34D399;font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.time-display{font-family:'Sora',sans-serif;font-size:42px;font-weight:700;text-align:center;letter-spacing:-1px;margin:0.5rem 0;color:var(--text);}
.punch-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--muted);}
.punch-row:last-child{border-bottom:none;}
.punch-row span:last-child{color:var(--text);font-family:'Sora',sans-serif;font-size:12px;}
.week-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #E2DAFF;font-size:13px;flex-wrap:wrap;}
.week-row:last-child{border-bottom:none;}
.row-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.row-item:last-child{border-bottom:none;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:2rem auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.notice{font-size:13px;color:var(--muted);text-align:center;padding:1rem;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.25rem;flex-wrap:wrap;}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.week-nav span{font-size:13px;font-weight:500;color:var(--text);}
.hero-card{background:#FFFFFF;border:1px solid #E2DAFF;border-radius:var(--radius);padding:1.5rem;margin-bottom:12px;text-align:center;}

.container{width:100%;max-width:var(--w,480px);}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px;}
.userbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge-inactive{background:rgba(139,135,176,0.15);color:var(--muted);}
.badge-ot{background:#FFE3E3;color:#B42318;}
label.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin:2px 0 -2px;}
textarea{width:100%;padding:11px 14px;border:1px solid #E2DAFF;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;background:#F8F5FF;color:#07051E;outline:none;resize:vertical;}
textarea:focus{border-color:var(--accent);}
.alert{border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;line-height:1.45;margin-bottom:12px;}
.alert-over{background:#FFE9E9;border:1px solid #FFB4B4;color:#8A1C1C;}
.alert-warn{background:#FFF6DC;border:1px solid #F5D98A;color:#7A5200;}
.stale{margin-top:4px;font-size:12px;color:#8A1C1C;background:#FFE9E9;border-radius:8px;padding:5px 8px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.btnrow .btn-full{width:auto;flex:1 1 240px;}
select#rt,select#tf,select#log-days{max-width:340px;margin-right:10px;}
.cols{display:grid;grid-template-columns:1fr;column-gap:40px;}
.pair{display:grid;grid-template-columns:1fr;gap:12px;}
.pair .card{margin-bottom:0;}
.split{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
.admin-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;}
@media(min-width:900px){
  .cols{grid-template-columns:1fr 1fr;}
  .pair{grid-template-columns:1fr 1fr;margin-bottom:12px;}
  .split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);}
  .admin-grid{grid-template-columns:1fr 1fr;}
  .stat-grid{max-width:640px;}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>

<script>
'use strict';
/* Nymbl Timeclock — Microsoft sign-in version 2.
   Security is enforced by the database (Row Level Security), not by this page. */
const SURL='https://hdjujofjpyzkzzhwaegb.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkanVqb2ZqcHl6a3p6aHdhZWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzI5NTksImV4cCI6MjA5MTg0ODk1OX0.bVvDP_d9dALvlvVnbuACftXlp4UEiYt_peU4hudFNTc';
const sb=window.supabase.createClient(SURL,SKEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

/* ---------- policy settings (change here) ---------- */
const STALE_HOURS=12;                      // still clocked in this long after last punch = forgot to punch out
const HOUR=3600000;

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=[{bg:'#2D1B69',text:'#C4B5FD'},{bg:'#1E3A5F',text:'#93C5FD'},{bg:'#1A3A2A',text:'#6EE7B7'},{bg:'#3B1F2B',text:'#F9A8D4'},{bg:'#2D2A1A',text:'#FDE68A'},{bg:'#1F2937',text:'#9CA3AF'}];
const clr=id=>COLORS[Math.abs(Number(id)||0)%COLORS.length];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';
const fmtT=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>new Date(ts).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const fmtDur=ms=>{const totalM=Math.round(ms/60000),h=Math.floor(totalM/60),m=totalM%60;return h>0?h+'h '+m+'m':m+'m';};
const toLDT=ts=>{const d=new Date(ts);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const TOLAB={pto:'PTO',sick:'Sick',holiday:'Holiday'};
const TOBADGE={pto:'badge-pto',sick:'badge-sick',holiday:'badge-holiday'};
const PL={shift_in:'Punch In',shift_out:'Punch Out',lunch_out:'Lunch start',lunch_in:'Lunch end'};
const TZ_IANA={EST:'America/New_York',CST:'America/Chicago',MST:'America/Denver',AZ:'America/Phoenix',PST:'America/Los_Angeles',AKST:'America/Anchorage',HST:'Pacific/Honolulu'};
const tzOf=a=>TZ_IANA[a&&a.timezone]||'UTC';
const toMinute=ts=>Math.floor(new Date(ts).getTime()/60000)*60000;
function dayKey(ts,iana){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:iana,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ts));
  const g=t=>p.find(x=>x.type===t).value;
  return g('year')+'-'+g('month')+'-'+g('day');
}
const fmtTz=(ts,iana)=>new Intl.DateTimeFormat('en-US',{timeZone:iana,hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(ts));
const dayLabel=k=>new Date(k+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',timeZone:'UTC'});
const hrs2=ms=>(Math.round(ms/36000)/100).toFixed(2);

function getWeekRange(offset){
  const now=new Date(),day=now.getDay();
  const sun=new Date(now);sun.setDate(now.getDate()-day+offset*7);sun.setHours(0,0,0,0);
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);sat.setHours(23,59,59,999);
  return{start:sun,end:sat};
}
function statusOf(p){if(!p)return'out';if(p.type==='shift_in'||p.type==='lunch_in')return'in';if(p.type==='lunch_out')return'lunch';return'out';}
function statusLabel(s){if(s==='in')return['In','badge-in'];if(s==='lunch')return['On lunch','badge-lunch'];return['Out','badge-out'];}
function actions(s){if(s==='out')return[['shift_in','Punch in','btn-primary']];if(s==='in')return[['lunch_out','🍽 Start lunch','btn-lunch'],['shift_out','Punch out','btn-danger']];if(s==='lunch')return[['lunch_in','🍽 End lunch','btn-lunch'],['shift_out','Punch out','btn-danger']];return[];}

/* Worked time per day — same method as the HR export, so every number in the app agrees.
   Punch times count to the minute. Day = the employee's own time zone. */
function dayCalc(punches,iana,nowMs){
  const byDay={};
  punches.forEach(p=>{const d=dayKey(p.punched_at,iana);(byDay[d]=byDay[d]||[]).push(p);});
  const todayK=nowMs!=null?dayKey(nowMs,iana):null;
  const res={};let total=0;
  Object.keys(byDay).sort().forEach(d=>{
    const ps=byDay[d].slice().sort((a,b)=>new Date(a.punched_at)-new Date(b.punched_at));
    let dayMs=0,lastIn=null,lastBreakOut=null,breakMs=0;
    ps.forEach(p=>{const t=toMinute(p.punched_at);
      if(p.type==='shift_in')lastIn=t;
      else if(p.type==='lunch_out')lastBreakOut=t;
      else if(p.type==='lunch_in'){if(lastBreakOut!==null)breakMs+=t-lastBreakOut;lastBreakOut=null;}
      else if(p.type==='shift_out'){if(lastIn!==null)dayMs+=t-lastIn;lastIn=null;}
    });
    if(d===todayK&&lastIn!==null){ // shift still open today: count time so far
      const n=toMinute(nowMs);dayMs+=Math.max(0,n-lastIn);if(lastBreakOut!==null)breakMs+=Math.max(0,n-lastBreakOut);
    }
    const ms=Math.max(0,dayMs-breakMs);res[d]=ms;total+=ms;
  });
  return{byDay:res,total};
}
function flagsFor(a,punches,nowMs){const c=dayCalc(punches,tzOf(a),nowMs);return{c,weekMs:c.total};}
function errMsg(e){
  const m=(e&&e.message)?e.message:String(e);
  if(e&&e.code==='23505')return 'That entry already exists (the email or name is already in use).';
  if((e&&e.code==='42501')||/row-level security|permission denied/i.test(m))return "You don't have permission to do that.";
  return m;
}

async function boot(){

  if(oauthErr)loginErr=oauthErr;
  try{const{data}=await sb.auth.getSession();session=data.session;}catch(e){loginErr='Sign-in problem: '+errMsg(e);}
  if(q.get('code')||q.get('error')||h.get('error'))history.replaceState({},document.title,location.pathname);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&session){session=null;resetState();view='login';render();}});
  if(session)await enter();else{view='login';render();}
}
async function enter(){
  view='loading';render();
  try{
    await sb.rpc('claim_access'); // links this login to the employee/manager record with the same email
    const uid=session.user.id;
    const[a,tm]=await Promise.all([
      must(sb.from('agents').select('*').eq('user_id',uid)),
      must(sb.from('team_members').select('*').eq('user_id',uid))
    ]);
    me.agent=(a&&a[0])||null;me.roles=tm||[];
    me.isAdmin=me.roles.some(r=>r.role==='admin'&&r.team_id==null);
    me.isHR=me.roles.some(r=>r.role==='hr'&&r.team_id==null);
    me.isManager=me.roles.some(r=>r.role==='manager');
    me.isMgr=me.isAdmin||me.isHR||me.isManager;
    teams=(await must(sb.from('teams').select('*').order('name')))||[];

    const isEmp=!!(me.agent&&me.agent.active);
    if(me.isMgr){await loadMgrData();await loadCurWeek();}
    if(isEmp)await loadMine();
    tab=isEmp?'me':'team';
    view='main';render();
  }catch(e){loginErr='Could not load your account: '+errMsg(e);view='error';render();}
}

/* ----- reports ----- */
function buildReport(){
  const{start,end}=getWeekRange(wkOffset);
  const nowMs=wkOffset===0?Date.now():null,past=wkOffset<0,rows=[];
  vis().forEach(a=>{
    const ps=wPunches.filter(p=>p.agent_id===a.id),to=wTO.filter(t=>t.agent_id===a.id);
    if(!ps.length&&!to.length)return;
    const f=flagsFor(a,ps,nowMs);
    const toBy={pto:0,sick:0,holiday:0};to.forEach(t=>{toBy[t.type]=(toBy[t.type]||0)+Number(t.hours);});
    const toH=Object.values(toBy).reduce((x,y)=>x+y,0);
    const issues=[];
    const sorted=ps.slice().sort((x,y)=>new Date(x.punched_at)-new Date(y.punched_at));
    const lp=sorted[sorted.length-1];
    if(lp&&statusOf(lp)!=='out'&&(past||Date.now()-new Date(lp.punched_at).getTime()>STALE_HOURS*HOUR))
      issues.push({kind:'open',text:'No punch-out after '+dayLabel(dayKey(lp.punched_at,tzOf(a)))+' '+fmtTz(lp.punched_at,tzOf(a))});
    rows.push({a,ps:sorted,to,c:f.c,workedMs:f.weekMs,toBy,toH,issues});
  });
  rows.sort((x,y)=>(teamName(x.a.team_id)||'').localeCompare(teamName(y.a.team_id)||'')||x.a.name.localeCompare(y.a.name));
  const wkS=start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const label=wkS+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return{start,end,rows,label,title:'Weekly Timesheet Report',csvLabel:'Week: '+wkS+' - '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),stamp:wkS.replace(/\s/g,'_')};
}

/* ----- planned time-off import ----- */
function splitCsvLine(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){out.push(cur.trim());cur='';}
    else cur+=c;
  }
  out.push(cur.trim());return out;
}
function normDate(ds){
  ds=String(ds||'').trim();
  let m=ds.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),k=null;
  if(m)k=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  else{m=ds.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)k=m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');}
  if(!k)return null;
  const d=new Date(k+'T12:00:00Z');
  return(!isNaN(d)&&d.toISOString().slice(0,10)===k)?k:null;
}
function weekdaysBetween(sk,ek){
  const out=[],e=new Date(ek+'T12:00:00Z');let d=new Date(sk+'T12:00:00Z');
  while(d<=e&&out.length<400){const w=d.getUTCDay();if(w!==0&&w!==6)out.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);}
  return out;
}
function parseTimeOff(txt){
  const rows=[],errors=[];let map=null;
  txt.split(/\r?\n/).forEach((raw,idx)=>{
    const line=raw.trim();if(!line)return;
    const c=splitCsvLine(line),ln=idx+1;
    if(idx===0&&/email/i.test(line)&&!/@/.test(line)){
      map={};
      c.forEach((h,i)=>{const k=h.toLowerCase().replace(/[^a-z]/g,'');
        if(/^(workemail|employeeemail|email)$/.test(k))map.email=i;
        else if(/^(date|dates|startdate|start)$/.test(k))map.date=i;
        else if(/^(enddate|end)$/.test(k))map.end=i;
        else if(/^(hours|hoursperday|duration)$/.test(k))map.hours=i;
        else if(/^(type|timeofftype|category)$/.test(k))map.type=i;
        else if(/^(note|notes|reason|comment|comments)$/.test(k))map.note=i;});
      if(map.email==null||map.date==null){errors.push({line:1,msg:'The header row needs an "Email" column and a "Date" column.'});map=null;}
      return;
    }
    const col=(name,pos)=>String(map?(map[name]!=null?c[map[name]]:''):(pos!=null?c[pos]:'')||'').trim();
    const email=col('email',0).toLowerCase();
    let ds=col('date',1),es=map?col('end'):'';
    const rg=ds.match(/^(.+?)\s+(?:to|through|thru)\s+(.+)$/i);
    if(rg){ds=rg[1];es=rg[2];}
    const hStr=col('hours',2).replace(/\s*h(ours?)?$/i,'');
    const tStr=col('type',3),note=col('note',4);
    if(!validEmail(email)){errors.push({line:ln,msg:'No valid email on this line.'});return;}
    const agent=agents.find(a=>(a.email||'')===email);
    if(!agent){errors.push({line:ln,msg:email+' is not an employee on your teams.'});return;}
    const sk=normDate(ds);
    if(!sk){errors.push({line:ln,msg:'Date not understood: "'+ds+'" (use 2026-12-24 or 12/24/2026).'});return;}
    let days=[sk];
    if(es){const ek=normDate(es);if(!ek||ek<sk){errors.push({line:ln,msg:'End date not understood or earlier than the start date.'});return;}
      days=weekdaysBetween(sk,ek);if(!days.length){errors.push({line:ln,msg:'That range has no weekdays.'});return;}
      if(days.length>60){errors.push({line:ln,msg:'Please keep each range to 60 weekdays or fewer.'});return;}}
    let hours=8;
    if(hStr){hours=Number(hStr);if(!(hours>0&&hours<=24)){errors.push({line:ln,msg:'Hours must be a number between 0 and 24.'});return;}}
    let type='pto';
    if(tStr){if(/sick/i.test(tStr))type='sick';else if(/pto|vacation|personal|time off|annual|leave/i.test(tStr))type='pto';else{errors.push({line:ln,msg:'Type "'+tStr+'" not understood — use PTO or Sick.'});return;}}
    days.forEach(d=>rows.push({line:ln,agent,date:d,hours,type,note}));
  });
  if(rows.length>2000){errors.push({line:0,msg:'That is more than 2000 days — please split the list.'});rows.length=0;}
  return{rows,errors};
}

/* ---------- holidays ---------- */
function nthWeekday(y,m,wd,n){
  if(n>0){const d=new Date(y,m,1);const off=(wd-d.getDay()+7)%7;return new Date(y,m,1+off+(n-1)*7);}
  const d=new Date(y,m+1,0);const off=(d.getDay()-wd+7)%7;return new Date(y,m,d.getDate()-off);
}
function observed(d){const w=d.getDay();if(w===6)return new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);if(w===0)return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return d;}
function suggestHolidays(y){
  const tg=nthWeekday(y,10,4,4);
  const L=[["New Year's Day",observed(new Date(y,0,1))],['Martin Luther King Jr. Day',nthWeekday(y,0,1,3)],["Presidents' Day",nthWeekday(y,1,1,3)],['Memorial Day',nthWeekday(y,4,1,-1)],['Juneteenth',observed(new Date(y,5,19))],['Independence Day',observed(new Date(y,6,4))],['Labor Day',nthWeekday(y,8,1,1)],['Thanksgiving Day',tg],['Day After Thanksgiving',new Date(tg.getFullYear(),tg.getMonth(),tg.getDate()+1)],['Christmas Day',observed(new Date(y,11,25))]];
  return L.map(([n,d])=>ymd(d)+', '+n+', 8').join('\n');
}
function parseHolidayLines(txt){
  const rows=[],bad=[];
  txt.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim();if(!line)return;
    const k=line.indexOf(',');
    if(k<0){bad.push(i+1);return;}
    const ds=line.slice(0,k).trim().replace(/^"|"$/g,''),rest=line.slice(k+1).trim();
    let iso=null,m=ds.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m)iso=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    else{m=ds.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)iso=m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');}
    if(!iso||isNaN(Date.parse(iso+'T12:00:00Z'))){if(i===0&&/date/i.test(ds))return;bad.push(i+1);return;}
    let name=rest,hours=8;const lm=rest.match(/^(.*),\s*(\d+(?:\.\d+)?)\s*$/);
    if(lm){name=lm[1];hours=Number(lm[2]);}
    name=name.trim().replace(/^"|"$/g,'').trim();
    if(!name||!(hours>0&&hours<=24)){bad.push(i+1);return;}
    rows.push({date:iso,name,hours});
  });
  return{rows,bad};
}

/* ---------- backup ---------- */
async function downloadBackup(){
  const spec=[['teams','*'],['team_members','*'],['agents','id,name,email,timezone,team_id,active,deactivated_at,user_id'],['punches','*'],['time_off','*'],['holidays','*']];
  const out={exported_at:new Date().toISOString(),exported_by:session.user.email,tables:{}},counts=[];
  for(const[name,cols]of spec){
    out.tables[name]=await fetchAll((f,t)=>sb.from(name).select(cols).order('id').range(f,t));
    counts.push(name+': '+out.tables[name].length);
  }
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='nymbl_timeclock_backup_'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();
  return counts.join(' · ');
}

      await must(sb.from('time_off').insert({agent_id:toAgent.id,team_id:toAgent.team_id,date,type,hours:Number(hours),note:note||null}));toList=(await getTO(toAgent.id))||[];toMsg='Added!';
    }catch(ex){toMsg='Error: '+errMsg(ex);}
    render();
  }
  else if(bid==='b-addteam'){
    const name=val('ntn').trim();
    if(!name){adminMsg='Enter a team name.';render();return;}
    try{await must(sb.from('teams').insert({name}));teams=(await must(sb.from('teams').select('*').order('name')))||[];adminMsg='';}catch(ex){adminMsg=errMsg(ex);}
    render();
  }
  else if(bid==='b-addmgr'){
    const email=val('nme').trim().toLowerCase(),scope=val('nms');
    if(!validEmail(email)){adminMsg='Enter a valid work email.';render();return;}
    const row=scope==='admin'?{email,role:'admin',team_id:null}:scope==='hr'?{email,role:'hr',team_id:null}:{email,role:'manager',team_id:Number(scope)};
    try{await must(sb.from('team_members').insert(row));await loadMgrData();adminMsg='';}catch(ex){adminMsg=errMsg(ex);}
    render();
  }
  else if(bid==='b-hsug'){holTxt=suggestHolidays(Number(val('hol-year')));holMsg='Suggested list loaded — edit it to match your company, then click Import.';holOk=true;render();}
  else if(bid==='b-himport'){
    holTxt=val('hol-txt');
    const{rows,bad}=parseHolidayLines(holTxt);
    if(bad.length){holMsg='Check line'+(bad.length>1?'s':'')+' '+bad.join(', ')+' — use: 2026-12-25, Christmas Day, 8';holOk=false;render();return;}
    if(!rows.length){holMsg='Nothing to import yet.';holOk=false;render();return;}
    if(!confirm('Import '+rows.length+' holiday'+(rows.length>1?'s':'')+' and add the time off to every active employee?'))return;
    try{
      const r=await must(sb.rpc('import_holidays',{p_rows:rows,p_include_past:holPast}));
      holMsg='Done: '+r.holidays+' holiday'+(r.holidays===1?'':'s')+' saved, '+r.timeoff_added+' time-off entries added.';holOk=true;holTxt='';await loadMgrData();
    }catch(ex){holMsg=errMsg(ex);holOk=false;}
    render();
  }
  else if(bid==='b-backup'){
    backupMsg='Preparing…';render();
    try{backupMsg='Downloaded. '+await downloadBackup();}catch(ex){backupMsg='Error: '+errMsg(ex);}
    render();
  }
});

/* ---------- downloads ---------- */
function downloadText(name,text,mime){
  const link=document.createElement('a');
  link.href='data:'+(mime||'text/csv')+';charset=utf-8,'+encodeURIComponent('\ufeff'+text);
  link.download=name;document.body.appendChild(link);link.click();link.remove();
}
const csvQ=s=>{s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};

/* CSV for payroll (same layout as the original timeclock) */
function exportCSV(){
  const R=currentReport();
  const grouped=R.rows.map(r=>({name:r.a.name,tz:r.a.timezone||'',events:r.ps,to:r.to}));
  const msToHrs=ms=>Math.round(ms/36000)/100;
  const fmt2=n=>n>0?n.toFixed(2):'';
  const agentFmt=(tz,ts,opts)=>new Intl.DateTimeFormat('en-US',{timeZone:TZ_IANA[tz]||'UTC',...opts}).format(new Date(ts));
  const PUNCH_LABEL={shift_in:'Punch In',shift_out:'Punch Out',lunch_out:'Lunch Out',lunch_in:'Lunch In'};
  const q=csvQ;
  let csv='Nymbl Timeclock Report\n';
  csv+='"'+R.csvLabel+'"\n';
  csv+='\n';
  csv+='Agent,Timezone,Date,Punch Type,Time,Hours Worked,Time Off Type,Time Off Hours,Note,Grand Total\n';
  grouped.forEach(g=>{
    if(!g.events.length&&!g.to.length)return;
    let workedHrsWeek=0,toHrsWeek=0;
    const agentDay=ts=>agentFmt(g.tz,ts,{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/(\d+)\/(\d+)\/(\d+)/,'$3-$1-$2');
    const fmtTime=ts=>agentFmt(g.tz,ts,{hour:'2-digit',minute:'2-digit',hour12:true});
    const byDay={};
    g.events.forEach(p=>{const day=agentDay(p.punched_at);if(!byDay[day])byDay[day]={punches:[],to:[]};byDay[day].punches.push(p);});
    g.to.forEach(x=>{const day=x.date;if(!byDay[day])byDay[day]={punches:[],to:[]};byDay[day].to.push(x);});
    csv+=q(g.name)+',"'+g.tz+'","","","","","","","",""\n';
    Object.entries(byDay).sort().forEach(([day,data])=>{
      const dl=new Date(day+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',year:'2-digit'});
      const sorted=[...data.punches].sort((a,b)=>new Date(a.punched_at)-new Date(b.punched_at));
      let dayMs=0,lastIn=null,lastBreakOut=null,breakMs=0;
      sorted.forEach(p=>{
        const tm=toMinute(p.punched_at);
        if(p.type==='shift_in'){lastIn=tm;}
        else if(p.type==='lunch_out'){lastBreakOut=tm;}
        else if(p.type==='lunch_in'){if(lastBreakOut!==null){breakMs+=tm-lastBreakOut;}lastBreakOut=null;}
        else if(p.type==='shift_out'){if(lastIn!==null){dayMs+=tm-lastIn;}lastIn=null;}
      });
      const dayWorkedHrs=msToHrs(Math.max(0,dayMs-breakMs));
      workedHrsWeek+=dayWorkedHrs;
      const toLabels=data.to.map(x=>TOLAB[x.type]).join(', ');
      const dayToHrs=data.to.reduce((s,x)=>s+Number(x.hours),0);
      toHrsWeek+=dayToHrs;
      const toNotes=data.to.map(x=>x.note).filter(Boolean).join(', ');
      sorted.forEach(p=>{csv+=',"",'+q(dl)+','+q(PUNCH_LABEL[p.type]||p.type)+','+q(fmtTime(p.punched_at))+',"","","","",""\n';});
      if(sorted.length===0&&data.to.length){csv+=',"",'+q(dl)+',"","","",'+q(toLabels)+','+q(dayToHrs>0?dayToHrs.toFixed(2):'')+','+q(toNotes)+',""\n';}
      csv+=',"","Daily Total","","",'+q(fmt2(dayWorkedHrs))+','+q(toLabels)+','+q(dayToHrs>0?dayToHrs.toFixed(2):'')+','+q(toNotes)+',""\n';
    });
    const grandTotal=workedHrsWeek+toHrsWeek;
    csv+=',"","'+'WEEK TOTAL'+'","","",'+q(fmt2(workedHrsWeek))+',"",'+q(toHrsWeek>0?toHrsWeek.toFixed(2):'')+',"",'+q(fmt2(grandTotal))+'\n';
    csv+='\n';
  });
  const tn=teamFilter!=='all'?'_'+teamName(teamFilter).replace(/[^a-z0-9]+/gi,'_'):'';
  downloadText('nymbl_timeclock'+tn+'_'+R.stamp+'.csv',csv);
}
function exportLogCSV(){
  const byId={};agents.forEach(a=>{byId[a.id]=a;});
  let csv='Nymbl Timeclock - Punch Change Log\n\nWhen,Changed by,Employee,Team,Action,Detail\n';
  visLog().forEach(l=>{const a=byId[l.agent_id]||{name:'Unknown',timezone:'EST'};
    csv+=[csvQ(new Date(l.at).toLocaleString('en-US')),csvQ(l.actor_email),csvQ(a.name),csvQ(teamName(l.team_id)),csvQ(l.action),csvQ(logDetail(l,a))].join(',')+'\n';});
  downloadText('nymbl_punch_change_log.csv',csv);
}

function openPrintDoc(title,sub,body){
  const logo=(document.querySelector('.logo-wrap img')||{}).src||'';
  const html='<!doctype html><html><head><meta charset="utf-8"><title>Nymbl '+esc(title)+' — '+esc(sub)+'</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>'+PRINT_CSS+'</style></head><body><div class="bar"><span>Use <b>Print</b>, then choose <b>Save as PDF</b> to keep a copy.</span><button onclick="window.print()">Print / Save as PDF</button></div><div class="page"><div class="head"><div>'+(logo?'<img src="'+logo+'" alt="Nymbl">':'<b>Nymbl</b>')+'</div><div><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></div></div>'+body+'</div></body></html>';
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(!w)alert('Your browser blocked the report window. Allow pop-ups for this site and try again.');
}
const scopeText=()=>teamFilter==='all'?(teams.length>1?'All teams':(teams[0]?teams[0].name:'')):teamName(teamFilter);
const genText=()=>new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});

function printReport(){
  const R=currentReport();
  let totW=0,totT=0,flagN=0;
  R.rows.forEach(r=>{totW+=r.workedMs;totT+=r.toH;flagN+=r.issues.length;});
  const issues=[];R.rows.forEach(r=>r.issues.forEach(i=>issues.push({r,i})));
  const sumRows=R.rows.map(r=>{
    const m=r.issues.length>0;
    return '<tr><td><b>'+esc(r.a.name)+'</b>'+(r.a.active?'':' <span class="tag">inactive</span>')+'</td><td>'+esc(teamName(r.a.team_id))+'</td><td class="n">'+hrs2(r.workedMs)+'</td><td class="n">'+(r.toBy.pto||'–')+'</td><td class="n">'+(r.toBy.sick||'–')+'</td><td class="n">'+(r.toBy.holiday||'–')+'</td><td class="n"><b>'+(Number(hrs2(r.workedMs))+r.toH).toFixed(2)+'</b></td><td>'+(m?'<span class="pill amber">Missing punch</span>':'')+'</td></tr>';
  }).join('');
  const sumTotals='<tr class="tot"><td colspan="2">Total</td><td class="n">'+hrs2(totW)+'</td><td class="n" colspan="3">'+totT.toFixed(2)+' off</td><td class="n">'+(Number(hrs2(totW))+totT).toFixed(2)+'</td><td></td></tr>';
  let teamTbl='';
  if(teams.length>1){
    const g={};R.rows.forEach(r=>{const n=teamName(r.a.team_id)||'—';const o=g[n]=g[n]||{n:0,w:0,t:0,f:0};o.n++;o.w+=r.workedMs;o.t+=r.toH;o.f+=r.issues.length;});
    const names=Object.keys(g).sort();
    if(names.length>1)teamTbl='<h2>By team</h2><table><thead><tr><th>Team</th><th class="n">Employees</th><th class="n">Worked</th><th class="n">Time off</th><th class="n">Missing punch</th></tr></thead><tbody>'+names.map(n=>'<tr><td><b>'+esc(n)+'</b></td><td class="n">'+g[n].n+'</td><td class="n">'+hrs2(g[n].w)+'</td><td class="n">'+g[n].t.toFixed(2)+'</td><td class="n">'+(g[n].f||'–')+'</td></tr>').join('')+'</tbody></table>';
  }
  const excTbl=issues.length?'<h2>Needs attention</h2><table><thead><tr><th>Employee</th><th>Team</th><th>Issue</th></tr></thead><tbody>'+issues.map(({r,i})=>'<tr><td><b>'+esc(r.a.name)+'</b></td><td>'+esc(teamName(r.a.team_id))+'</td><td><span class="pill amber">Missing punch</span> '+esc(i.text)+'</td></tr>').join('')+'</tbody></table>':'';
  const detail=R.rows.map(r=>{
    const iana=tzOf(r.a),byDay={};
    r.ps.forEach(p=>{const d=dayKey(p.punched_at,iana);(byDay[d]=byDay[d]||{ps:[],to:[]}).ps.push(p);});
    r.to.forEach(t=>{const d=String(t.date);(byDay[d]=byDay[d]||{ps:[],to:[]}).to.push(t);});
    const rows=Object.keys(byDay).sort().map(d=>{
      const o=byDay[d],ms=r.c.byDay[d]||0,parts=[];
      for(let k=0;k<o.ps.length;k++){const p=o.ps[k],tm=fmtTz(p.punched_at,iana);
        if(p.type==='shift_in')parts.push('In '+tm);
        else if(p.type==='shift_out')parts.push('Out '+tm);
        else if(p.type==='lunch_out'){const n=o.ps[k+1];if(n&&n.type==='lunch_in'){parts.push('Lunch '+tm+' – '+fmtTz(n.punched_at,iana));k++;}else parts.push('Lunch out '+tm);}
        else parts.push('Lunch in '+tm);}
      const toTxt=o.to.map(t=>esc(TOLAB[t.type]||t.type)+' '+esc(t.hours)+'h'+(t.note?' ('+esc(t.note)+')':'')).join(', ');
      return '<tr><td class="day">'+esc(dayLabel(d))+'</td><td>'+(parts.length?esc(parts.join('  ·  ')):'<span class="muted">—</span>')+'</td><td class="n">'+(o.ps.length?hrs2(ms):'–')+'</td><td>'+toTxt+'</td></tr>';
    }).join('');
    return '<div class="emp"><div class="emp-h"><div><b>'+esc(r.a.name)+'</b><span class="muted"> · '+esc(teamName(r.a.team_id))+' · '+esc(r.a.timezone||'')+'</span></div><div>Worked <b>'+hrs2(r.workedMs)+'</b>'+(r.toH?' &nbsp;+&nbsp; Off <b>'+r.toH.toFixed(2)+'</b>':'')+'</div></div><table class="dt"><thead><tr><th style="width:62px">Day</th><th>Punches</th><th class="n" style="width:64px">Hours</th><th style="width:130px">Time off</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join('');
  const body='<div class="kpis"><div class="kpi"><b>'+R.rows.length+'</b><span>Employees with activity</span></div><div class="kpi"><b>'+hrs2(totW)+'</b><span>Hours worked</span></div><div class="kpi"><b>'+totT.toFixed(2)+'</b><span>Time-off hours</span></div><div class="kpi'+(flagN?' warn':'')+'"><b>'+flagN+'</b><span>Missing punch-outs</span></div></div>'
  +'<div class="muted" style="font-size:9.5px">Generated '+esc(genText())+' by '+esc(session.user.email)+'.</div>'
  +(R.rows.some(r=>r.a.tz_confirmed===false)?'<div class="muted" style="font-size:9.5px;color:#93370D">Note: time zone is not yet confirmed for '+R.rows.filter(r=>r.a.tz_confirmed===false).map(r=>esc(r.a.name)).join(', ')+'; their punch times may display in the wrong zone.</div>':'')
  +excTbl+teamTbl
  +'<h2>Employee summary</h2><table><thead><tr><th>Employee</th><th>Team</th><th class="n">Worked</th><th class="n">PTO</th><th class="n">Sick</th><th class="n">Holiday</th><th class="n">Total</th><th>Notes</th></tr></thead><tbody>'+(sumRows||'<tr><td colspan="8" class="muted">No activity in this period.</td></tr>')+sumTotals+'</tbody></table>'
  +'<h2>Daily detail</h2>'+(detail||'<p class="muted">No activity in this period.</p>')
  +'<div class="sign"><div>Manager approval &nbsp;&nbsp;&nbsp;&nbsp; Date</div><div>Payroll / HR review &nbsp;&nbsp;&nbsp;&nbsp; Date</div></div>';
  openPrintDoc(R.title,R.label+' · '+scopeText(),body);
}
